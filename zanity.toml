#:schema ./zanity.schema.json
# Every rule, including those off by default: zanity's own code is held to all of them.
rules = ["all"]

# Fixtures are deliberately bad code, and their expected output depends on it: check them only
# when a test names them, and never --fix them. The catalogue's own scripts are vendored from its
# release unchanged, so they are fixed there, not here.
exclude = ["tests/golden/", "tests/fix/", "tests/config/", "tests/infer/project/", "tests/infer/calibration/", "catalogue/catalogue.py", "catalogue/standards.py", "catalogue/import_cwe.py"]

# End-to-end tests: they run the built zanity and read the fixtures and catalogue in the repo,
# which is what they test.
[paths."src/golden_test.zig"]
disable = ["filesystem-in-test", "process-in-test"]

[paths."src/architecture_test.zig"]
disable = ["filesystem-in-test"]

[paths."src/catalogue_test.zig"]
disable = ["filesystem-in-test"]

# --infer: report every judgement TypeSafe thinks is more likely right than not, the strictest
# useful bar, rather than the default 0.8.
[infer]
concurrency = 8
threshold = 0.8
