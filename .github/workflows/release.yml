name: Release

# Every commit that passes CI on main is released, one patch version up from the latest v* tag
# (0.1.0 if there is none). To raise the minor or major version instead, run this by hand:
#   gh workflow run release -f bump=minor
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: minor

permissions:
  contents: write

# Releases queue rather than race, so two never take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # A release by hand hasn't been through CI yet; one after CI on main has.
  test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  version:
    needs: test
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' && needs.test.result == 'success' ||
       github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
      BUMP: ${{ inputs.bump || 'patch' }}
    outputs:
      commit: ${{ steps.version.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
          fetch-depth: 0
      - name: Choose the version
        id: version
        run: |
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ] && git tag --points-at HEAD | grep -q '^v'; then
            echo "::notice::$COMMIT is already released as $(git tag --points-at HEAD | head -n1)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next=0.1.0
          else
            v=${latest#v}; major=${v%%.*}; rest=${v#*.}; minor=${rest%%.*}; patch=${rest#*.}
            case "$BUMP" in
              major) next=$((major + 1)).0.0 ;;
              minor) next=$major.$((minor + 1)).0 ;;
              *) next=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "Releasing v$next (after ${latest:-no release})."
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: always() && needs.version.result == 'success' && needs.version.outputs.skip != 'true'
    strategy:
      matrix:
        platform: [linux-x86_64, linux-aarch64, macos-x86_64, macos-aarch64, windows-x86_64]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.commit }}
      - uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
        with:
          cache-key: ${{ matrix.platform }}
      - name: Build ${{ matrix.platform }}
        run: zig build release -Dplatform=${{ matrix.platform }} -Dversion=$VERSION
      - name: Check the version it reports
        if: matrix.platform == 'linux-x86_64'
        run: |
          built=$(./zig-out/release/zanity-linux-x86_64 --version)
          if [ "$built" != "zanity $VERSION" ]; then
            echo "::error::The release binary reports '$built', not zanity $VERSION; check that build.zig passes -Dversion into build_info."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: zanity-${{ matrix.platform }}
          path: zig-out/release/*
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      # Creates the tag on the tested commit. GitHub lists each binary's SHA-256 on the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$VERSION" release/*
          --repo "$GITHUB_REPOSITORY" --target "${{ needs.version.outputs.commit }}"
          --title "zanity v$VERSION" --generate-notes
