name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs this first, so nothing is released that fails it.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request makes an older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ZIG_CACHE_LIMIT_MB: 2048
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Installs the Zig in build.zig.zon's minimum_zig_version.
      - uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
        with:
          cache-size-limit: ${{ env.ZIG_CACHE_LIMIT_MB }}
      - name: Formatting
        run: zig fmt --check build.zig build.zig.zon src languages/*.zig languages/*.zon
      # Unit, golden, architecture and catalogue tests, and zanity checking its own Zig source.
      - run: zig build test test-integration --summary all
      # Every file in the repository, every rule, warnings included, as a user's CI would run it.
      - name: zanity check . --strict
        run: zig build && ./zig-out/bin/zanity check . --strict
      - name: Zig cache size
        if: always() && env.ZIG_GLOBAL_CACHE_DIR != ''
        run: |
          bytes=$(python3 -c 'import os, sys; print(sum(os.path.getsize(os.path.join(d, f)) for d, _, fs in os.walk(sys.argv[1]) for f in fs if os.path.isfile(os.path.join(d, f))))' "$ZIG_GLOBAL_CACHE_DIR")
          used=$((bytes / 1048576))
          echo "Zig cache: ${used} MB of ${ZIG_CACHE_LIMIT_MB} MB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt $((ZIG_CACHE_LIMIT_MB * 1048576)) ]; then
            echo "::warning::The Zig cache is ${used} MB, past its ${ZIG_CACHE_LIMIT_MB} MB limit, so it is emptied and the next run builds from scratch. If this shows on every run, one build needs more: raise ZIG_CACHE_LIMIT_MB in .github/workflows/ci.yml."
          fi

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # The catalogue's rule mapping and triage are generated; a stale copy fails here.
      - name: Generated catalogue files are current
        run: |
          uv run --with 'PyYAML==6.0.3' python catalogue/sync.py
          python3 catalogue/triage.py
          git diff --exit-code -- catalogue || { echo "::error::The files above are out of date. Run: uv run --with 'PyYAML==6.0.3' python catalogue/sync.py && python3 catalogue/triage.py, then commit the result."; exit 1; }
