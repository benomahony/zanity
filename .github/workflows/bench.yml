name: Bench

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        repository:
          - pallets/click
          - django/django
          - rust-lang/rust-analyzer
          - kubernetes/kubernetes
          - microsoft/vscode
    name: ${{ matrix.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY: ${{ matrix.repository }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: xyzzylabs/setup-zig@7e5af686da64007a0797898801de180e5f4d3762 # v1.0.5
      - name: Clone ${{ matrix.repository }}
        run: git clone --quiet --depth 1 "https://github.com/$REPOSITORY" "$RUNNER_TEMP/corpus"
      - name: zig build bench
        shell: bash
        run: |
          zig build bench -Dcorpus="$RUNNER_TEMP/corpus" | tee "$RUNNER_TEMP/bench.txt"
          {
            echo "### $REPOSITORY at $(git -C "$RUNNER_TEMP/corpus" rev-parse --short HEAD)"
            echo '```'
            cat "$RUNNER_TEMP/bench.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
