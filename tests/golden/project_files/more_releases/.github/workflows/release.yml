on:
  push:
    tags: ["v*"]
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/example/app:latest
  image-build-only:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/build-push-action@v6
        with:
          push: false
  monorepo:
    runs-on: ubuntu-latest
    steps:
      - run: npx lerna publish from-git
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: ./deploy.sh
