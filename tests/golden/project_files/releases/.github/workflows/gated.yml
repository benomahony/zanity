on:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  pypi:
    needs: [check]
    if: >-
      always() &&
      needs.check.result == 'success'
    steps:
      - uses: pypa/gh-action-pypi-publish@release/v1
  after-ci:
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Publish
        run: |
          echo "no test here"
          gh release create "v1" --notes "check"
  untested:
    steps:
      - run: |
          npm ci
          npm publish
